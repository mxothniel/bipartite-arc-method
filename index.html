<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Othniel Etienne Bipartite-Arc Method — Handshake Problem</title>
<link rel="icon" href="https://anninove.org/img/ANN-INOVE-ICON-512-yellow-100x100.png" sizes="32x32">
<link rel="icon" href="https://anninove.org/img/ANN-INOVE-ICON-512-yellow-300x300.png" sizes="192x192">
<link rel="apple-touch-icon" href="https://anninove.org/img/ANN-INOVE-ICON-512-yellow-300x300.png">
<meta name="msapplication-TileImage" content="https://anninove.org/img/ANN-INOVE-ICON-512-yellow-300x300.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

body { margin: 0; background: #f1efe9; padding: 20px 12px; }

.hs-app {
  --paper: #faf9f6;
  --grid: #e4e7e2;
  --red: #b3392c;
  --teal: #146b79;
  --ink: #232323;
  --amber: #c98a2c;

  font-family: 'Inter', sans-serif;
  color: var(--ink);
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 32px 32px,
    var(--paper);
  border-radius: 4px;
  padding: 24px 32px 36px;
  max-width: 980px;
  margin: 0 auto;
}

.hs-topbar { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 4px; }
.lang-btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 4px 9px;
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
  border-radius: 3px; cursor: pointer;
}
.lang-btn.active { background: var(--ink); color: var(--paper); }

.hs-logo-wrap { display: flex; justify-content: center; margin: 2px 0 10px; }
.hs-logo-wrap img { height: 150px; width: auto; }

.hs-header {
  display: flex; justify-content: space-between; align-items: flex-end;
  border-bottom: 1.5px solid var(--ink); padding-bottom: 14px; margin-bottom: 6px;
  flex-wrap: wrap; gap: 10px;
}
.hs-title { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
.hs-formula {
  font-family: 'IBM Plex Mono', monospace; font-size: 15px; background: var(--ink);
  color: var(--paper); padding: 6px 12px; border-radius: 3px; white-space: nowrap;
}
.hs-formula .val { color: #f2d49b; font-weight: 600; }
.hs-nnote { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6b6b6b; margin: 6px 0 18px; }

.hs-tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
.hs-tab {
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 8px 14px;
  border: 1.5px solid var(--ink); background: transparent; cursor: pointer;
  border-radius: 3px; color: var(--ink);
}
.hs-tab.active { background: var(--ink); color: var(--paper); }

.hs-panel { display: none; }
.hs-panel.active { display: block; }

.hs-radio-row {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; margin-bottom: 10px;
}
.hs-radio-row label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.hs-radio-row input { accent-color: var(--amber); }

.hs-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.hs-input {
  font-family: 'IBM Plex Mono', monospace; font-size: 15px; padding: 8px 10px;
  border: 1.5px solid var(--ink); border-radius: 3px; width: 110px; background: white;
}
.hs-input:focus { outline: 2px solid var(--amber); outline-offset: 1px; }

.hs-btn {
  font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; padding: 9px 16px;
  border: none; border-radius: 3px; cursor: pointer; background: var(--amber);
  color: #2a1d05; transition: transform 0.08s ease;
}
.hs-btn:hover { transform: translateY(-1px); }
.hs-btn:active { transform: translateY(0); }
.hs-btn.secondary { background: transparent; border: 1.5px solid var(--ink); color: var(--ink); }
.hs-btn.ghost { background: transparent; border: 1.5px dashed var(--teal); color: var(--teal); }

.hs-msg { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--red); min-height: 18px; }

.hs-toggles {
  display: flex; gap: 18px; margin: 4px 0 16px; font-family: 'IBM Plex Mono', monospace;
  font-size: 13px; flex-wrap: wrap; align-items: center;
}
.hs-toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.hs-toggles input { accent-color: var(--amber); }

.hs-canvas-wrap { background: white; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
svg#graph { display: block; width: 100%; height: auto; }

.node-label { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; fill: var(--red); }
.num-label { font-family: 'IBM Plex Mono', monospace; font-size: 13px; fill: var(--teal); }
.num-bg { fill: white; opacity: 0.88; }

.hide-letters .node-label { display: none; }
.hide-numbers .num-label, .hide-numbers .num-bg, .hide-numbers .ext-line { display: none; }

.hs-below-canvas {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 12px; flex-wrap: wrap; gap: 10px;
}
.hs-footer-note { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6b6b6b; max-width: 640px; }

.hs-method { margin-top: 34px; padding-top: 22px; border-top: 1.5px solid var(--ink); }
.hs-method h2 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; margin: 0 0 14px; }
.hs-method p { font-size: 14.5px; line-height: 1.65; color: #333; margin: 0 0 14px; }
.hs-method h3 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; margin: 22px 0 10px; }
.hs-apps { margin: 0 0 14px; padding-left: 22px; }
.hs-apps li { font-size: 14.5px; line-height: 1.6; color: #333; margin-bottom: 7px; }
.hs-method p.hs-apps-note { font-weight: 600; color: var(--ink); border-left: 4px solid var(--amber); padding: 6px 0 6px 12px; background: rgba(201,138,44,0.08); }

.hs-art-row { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; margin: 6px 0 10px;
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
.hs-art-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.hs-art-row select { font-family: inherit; font-size: 13px; padding: 5px 6px; border: 1.5px solid var(--ink); border-radius: 3px; background: white; }
.hs-art-row input[type=range] { accent-color: var(--amber); width: 120px; }
.hs-art-row input[type=checkbox] { accent-color: var(--amber); }
.hs-canvas-wrap.bg-transparent { background: repeating-conic-gradient(#e6e6e6 0% 25%, #ffffff 0% 50%) 50% / 20px 20px !important; }
.hide-art-cross .art-cross, .hide-art-arc .art-arc { display: none; }
.hs-breakdown { margin: 4px 0 10px; border: 1.5px solid var(--ink); border-radius: 4px; background: white; max-width: 560px;
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
.hs-breakdown .bd-row { display: flex; justify-content: space-between; gap: 14px; padding: 7px 12px; border-bottom: 1px solid #e4e7e2; }
.hs-breakdown .bd-row b { white-space: nowrap; }
.hs-breakdown .bd-row.total { background: var(--ink); color: var(--paper); border-bottom: none; }
.hs-breakdown .bd-row.total b { color: #f2d49b; }
.hs-breakdown .bd-identity { padding: 8px 12px; color: var(--teal); font-weight: 600; border-top: 1.5px solid var(--ink); }
details.hs-acc { border: 1.5px solid var(--ink); border-radius: 4px; background: white; margin: 14px 0; }
details.hs-acc > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 13px 16px; font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; line-height: 1.3; }
details.hs-acc > summary::-webkit-details-marker { display: none; }
details.hs-acc > summary:hover { background: rgba(201,138,44,0.10); }
details.hs-acc > summary:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
details.hs-acc .arrow { flex: none; width: 22px; height: 22px; transition: transform 0.2s ease; }
details.hs-acc[open] > summary .arrow { transform: rotate(180deg); }
details.hs-acc[open] > summary { border-bottom: 1.5px solid var(--ink); }
.hs-acc-body { padding: 14px 18px 6px; }
.hs-acc-body ol.hs-apps { padding-left: 22px; }
.gp-ex { display: block; margin-top: 6px; padding-left: 10px; border-left: 3px solid var(--amber); }
.gp-ex em { font-style: normal; font-weight: 600; color: var(--teal); }

.hs-footer-brand { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 30px; padding-top: 18px; border-top: 1px solid #d8dbd6; }
.hs-footer-brand img { height: 50px; width: auto; display: block; }
.hs-footer-brand a.txt { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 1.5px solid var(--amber); }
.hs-footer-brand a.txt:hover { color: var(--teal); }
#hsApp[data-mode="groups"] .hs-footer-note { display: none; }
.hs-export-row { margin-left: auto; }
.hs-export-row { display: flex; gap: 8px; flex-wrap: wrap; }

@media (max-width: 600px) { .hs-app { padding: 16px 14px 28px; } .hs-title { font-size: 22px; } }
</style>
</head>
<body>

<div class="hs-app" id="hsApp" data-mode="solve">
  <div class="hs-topbar">
    <button class="lang-btn active" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="fr">FR</button>
    <button class="lang-btn" data-lang="kr">KR</button>
    <button class="lang-btn" data-lang="es">ES</button>
  </div>

  <div class="hs-logo-wrap">
    <a href="https://anninove.org/" target="_blank" rel="noopener noreferrer" title="Fondasyon Ann Inove">
      <img src="https://anninove.org/img/anninove-logo-yellow-300x232.png" alt="Fondasyon Ann Inove">
    </a>
  </div>

  <div class="hs-header">
    <div class="hs-title" data-i18n="appTitle">The Handshake Problem</div>
    <div class="hs-formula">n(n−1)/2 = <span class="val" id="formulaVal">0</span></div>
  </div>
  <div class="hs-nnote" data-i18n="nNote"></div>

  <div class="hs-tabs">
    <button class="hs-tab active" data-tab="solve" data-i18n="tabSolve"></button>
    <button class="hs-tab" data-tab="build" data-i18n="tabBuild"></button>
    <button class="hs-tab" data-tab="groups" data-i18n="tabGroups"></button>
    <button class="hs-tab" data-tab="art" data-i18n="tabArt"></button>
  </div>

  <div class="hs-panel active" id="panel-solve">
    <div class="hs-radio-row">
      <span data-i18n="knownLabel"></span>
      <label><input type="radio" name="solveMode" value="handshakes" checked> <span data-i18n="knownHandshakes"></span></label>
      <label><input type="radio" name="solveMode" value="people"> <span data-i18n="knownPeople"></span></label>
    </div>
    <div class="hs-controls">
      <input type="number" min="1" class="hs-input" id="totalInput" data-i18n-ph="inputPlaceholder">
      <button class="hs-btn" id="solveBtn" data-i18n="buildBtn"></button>
      <button class="hs-btn secondary" id="resetBtn1" data-i18n="resetBtn"></button>
    </div>
    <div class="hs-msg" id="solveMsg"></div>
  </div>

  <div class="hs-panel" id="panel-build">
    <div class="hs-controls">
      <button class="hs-btn" id="addBtn" data-i18n="addBtn"></button>
      <button class="hs-btn secondary" id="resetBtn2" data-i18n="resetBtn"></button>
    </div>
  </div>

  <div class="hs-panel" id="panel-groups">
    <div class="hs-controls">
      <span data-i18n="groupALabel" style="font-family:'IBM Plex Mono',monospace;font-size:13px;"></span>
      <input type="number" min="1" class="hs-input" id="groupA" value="12" style="width:80px;">
      <span data-i18n="groupBLabel" style="font-family:'IBM Plex Mono',monospace;font-size:13px;"></span>
      <input type="number" min="1" class="hs-input" id="groupB" value="8" style="width:80px;">
      <button class="hs-btn" id="groupsBuildBtn" data-i18n="buildBtn"></button>
      <button class="hs-btn secondary" id="resetBtn4" data-i18n="resetBtn"></button>
    </div>
    <div class="hs-msg" id="groupsMsg"></div>
    <div class="hs-breakdown" id="groupsBreakdown">
      <div class="bd-row"><span data-i18n="bdTop"></span><b id="bdTopVal">0 / 0</b></div>
      <div class="bd-row"><span data-i18n="bdBottom"></span><b id="bdBottomVal">0 / 0</b></div>
      <div class="bd-row"><span data-i18n="bdLines"></span><b id="bdLinesVal">0 / 0</b></div>
      <div class="bd-row total"><span data-i18n="bdTotal"></span><b id="bdTotalVal">0 / 0</b></div>
      <div class="bd-identity" id="bdIdentity"></div>
    </div>
    <div class="hs-nnote" data-i18n="groupsHint"></div>
  </div>

  <div class="hs-panel" id="panel-art">
    <div class="hs-controls">
      <span data-i18n="artPeopleLabel" style="font-family:'IBM Plex Mono',monospace;font-size:13px;"></span>
      <input type="number" min="2" class="hs-input" id="artInput" value="60">
      <button class="hs-btn" id="artBuildBtn" data-i18n="artBuildBtn"></button>
      <button class="hs-btn secondary" id="resetBtn3" data-i18n="resetBtn"></button>
    </div>
    <div class="hs-art-row">
      <label><span data-i18n="artPalette"></span>
        <select id="artPalette">
          <option value="brand" data-i18n="palBrand"></option>
          <option value="haiti" data-i18n="palHaiti"></option>
          <option value="sunset" data-i18n="palSunset"></option>
          <option value="ocean" data-i18n="palOcean"></option>
          <option value="ink" data-i18n="palInk"></option>
          <option value="gold" data-i18n="palGold"></option>
        </select></label>
      <label><span data-i18n="artBackground"></span>
        <select id="artBg">
          <option value="white" data-i18n="bgWhite"></option>
          <option value="paper" data-i18n="bgPaper"></option>
          <option value="night" data-i18n="bgNight"></option>
          <option value="transparent" data-i18n="bgTransparent"></option>
        </select></label>
      <label><span data-i18n="artWeight"></span> <input type="range" id="artWeight" min="0.3" max="2.5" step="0.1" value="1"></label>
    </div>
    <div class="hs-art-row">
      <label><input type="checkbox" id="artShowLines" checked> <span data-i18n="artLines"></span></label>
      <label><input type="checkbox" id="artShowArcs" checked> <span data-i18n="artArcs"></span></label>
      <label><input type="checkbox" id="artSignature" checked> <span data-i18n="artSignature"></span></label>
    </div>
    <div class="hs-nnote" data-i18n="artHint"></div>
    <div class="hs-msg" id="artMsg"></div>
  </div>

  <div class="hs-toggles" id="togglesRow">
    <label><input type="checkbox" id="toggleLetters" checked> <span data-i18n="showLetters"></span></label>
    <label><input type="checkbox" id="toggleNumbers" checked> <span data-i18n="showNumbers"></span></label>
    <label><input type="checkbox" id="toggleStep"> <span data-i18n="stepThrough"></span></label>
    <button class="hs-btn ghost" id="nextBtn" style="display:none;"></button>
  </div>

  <div class="hs-canvas-wrap">
    <svg id="graph" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="hs-below-canvas">
    <div class="hs-footer-note" data-i18n="footerNote"></div>
    <div class="hs-export-row">
      <button class="hs-btn secondary" id="exportBtn" data-i18n="exportSvg"></button>
      <button class="hs-btn secondary" id="exportPngBtn" data-i18n="exportPng"></button>
    </div>
  </div>

  <div class="hs-method">
    <h2 data-i18n="methodTitle"></h2>
    <p data-i18n="methodP1"></p>
    <details class="hs-acc" id="accHandshakes">
      <summary><span data-i18n="gpTitle"></span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="hs-acc-body">
        <p data-i18n="gpIntro"></p>
        <ol class="hs-apps">
        <li><strong data-i18n="gp1t"></strong> <span data-i18n="gp1d"></span>
          <span class="gp-ex"><em data-i18n="gpExLabel"></em> <span data-i18n="gp1x"></span></span>
        </li>
        <li><strong data-i18n="gp2t"></strong> <span data-i18n="gp2d"></span>
          <span class="gp-ex"><em data-i18n="gpExLabel"></em> <span data-i18n="gp2x"></span></span>
        </li>
        <li><strong data-i18n="gp3t"></strong> <span data-i18n="gp3d"></span>
          <span class="gp-ex"><em data-i18n="gpExLabel"></em> <span data-i18n="gp3x"></span></span>
        </li>
        <li><strong data-i18n="gp4t"></strong> <span data-i18n="gp4d"></span>
          <span class="gp-ex"><em data-i18n="gpExLabel"></em> <span data-i18n="gp4x"></span></span>
          <span class="gp-ex"><em data-i18n="gpExLabel"></em> <span data-i18n="gp4y"></span></span>
        </li>
        <li><strong data-i18n="gp5t"></strong> <span data-i18n="gp5d"></span>
          <span class="gp-ex"><em data-i18n="gpExLabel"></em> <span data-i18n="gp5x"></span></span>
        </li>
        <li><strong data-i18n="gp6t"></strong> <span data-i18n="gp6d"></span>
          <span class="gp-ex"><em data-i18n="gpExLabel"></em> <span data-i18n="gp6x"></span></span>
        </li>
        </ol>
      </div>
    </details>
    <details class="hs-acc" id="accClassroom">
      <summary><span data-i18n="appsTitle"></span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="hs-acc-body">
        <ol class="hs-apps">
          <li data-i18n="app1"></li>
          <li data-i18n="app2"></li>
          <li data-i18n="app3"></li>
          <li data-i18n="app4"></li>
          <li data-i18n="app5"></li>
          <li data-i18n="app6"></li>
        </ol>
        <p class="hs-apps-note" data-i18n="appsNote"></p>
      </div>
    </details>
    <p data-i18n="methodP2"></p>
  </div>

  <div class="hs-footer-brand">
    <a href="https://anninove.org/" target="_blank" rel="noopener noreferrer" title="Fondasyon Ann Inove">
      <img src="https://anninove.org/img/anninove-logo-yellow-300x232.png" alt="Fondasyon Ann Inove">
    </a>
    <a class="txt" href="https://anninove.org/" target="_blank" rel="noopener noreferrer">Fondasyon Ann Inove</a>
  </div>
</div>

<script>
(function(){
  // ---------------------------------------------------------------

  let currentLang = 'en';
  function t(key){ return translations[currentLang][key]; }

  function applyLanguage(lang){
    currentLang = lang;
    document.documentElement.lang = (lang === 'kr') ? 'ht' : lang;
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const v = translations[lang][el.getAttribute('data-i18n')];
      if (typeof v === 'string') el.textContent = v;
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
      el.setAttribute('placeholder', translations[lang][el.getAttribute('data-i18n-ph')]);
    });
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
    updateStepButton();
  }
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.addEventListener('click', ()=>applyLanguage(b.dataset.lang));
  });

  // ---------------------------------------------------------------
  // GRAPH ENGINE
  // ---------------------------------------------------------------
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById('graph');
  const RED = '#b3392c', TEAL = '#146b79', GRAY = '#8a8f8a';
  const SPACING = 80, X0 = 80, TOP_Y = 260, BOT_Y = 440;
  const MIN_DIST = 26, L_START = 46, L_STEP = 16, L_MAX = 220;

  let topNodes = [], botNodes = [];
  let edgeCount = 0, letterCounter = 0;
  let placedExt = [], animQueue = [], animating = false;
  let counts = {cross:0, top:0, bottom:0};
  let groupsExpected = null;   // {a, b} when a two-group diagram is built

  // ---- ART MODE ----
  let artMode = false, artTotal = 0;
  const ART_PALETTES = {
    brand:  ['#146b79', '#c98a2c', '#b3392c'],
    haiti:  ['#1f4fd8', '#6a2a7a', '#d21034'],
    sunset: ['#ffd166', '#ef476f', '#5b2a86'],
    ocean:  ['#9be7ff', '#1e88e5', '#0b2a5b'],
    ink:    ['#111111', '#555555', '#9a9a9a'],
    gold:   ['#f6e27a', '#c98a2c', '#8a5a14']
  };
  const ART_BGS = { white:'#ffffff', paper:'#faf6ec', night:'#0f1420', transparent:null };
  function hexToRgb(h){ return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); }
  function colorAt(t, stops){
    t = Math.min(1, Math.max(0, t));
    const seg = t * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(seg)), f = seg - i;
    const a = hexToRgb(stops[i]), b = hexToRgb(stops[i+1]);
    return 'rgb(' + a.map((v,k)=>Math.round(v + (b[k]-v)*f)).join(',') + ')';
  }
  function styleArt(el){
    const stops = ART_PALETTES[document.getElementById('artPalette').value];
    const col = colorAt(parseFloat(el.dataset.t), stops);
    const w = parseFloat(document.getElementById('artWeight').value);
    const op = artTotal <= 30 ? 0.85 : (artTotal <= 100 ? 0.6 : 0.45);
    if (el.classList.contains('art-dot')) { el.setAttribute('fill', col); return; }
    el.setAttribute('stroke', col);
    el.setAttribute('stroke-width', (el.classList.contains('art-arc') ? 1.1 : 1.0) * w);
    el.setAttribute('opacity', op);
  }
  function restyleAll(){ svg.querySelectorAll('.art-cross,.art-arc,.art-dot').forEach(styleArt); }
  function artT(order){ return artTotal > 1 ? order / (artTotal - 1) : 0; }
  function applyArtBg(){
    const wrap = svg.parentElement;
    wrap.classList.remove('bg-transparent');
    wrap.style.background = '';
    if (!artMode) return;
    const v = document.getElementById('artBg').value;
    if (v === 'transparent') wrap.classList.add('bg-transparent'); else wrap.style.background = ART_BGS[v];
  }

  // Bounding box of everything drawn so far -> drives the auto-fit viewBox
  const DEFAULT_VB = [0, 0, 900, 700];
  const VB_PAD = 40;
  let bounds = null;
  function resetBounds(){ bounds = {minX:Infinity, minY:Infinity, maxX:-Infinity, maxY:-Infinity}; }
  function expand(x, y){
    if (x < bounds.minX) bounds.minX = x;
    if (x > bounds.maxX) bounds.maxX = x;
    if (y < bounds.minY) bounds.minY = y;
    if (y > bounds.maxY) bounds.maxY = y;
  }
  function fitViewBox(){
    if (!isFinite(bounds.minX)) { svg.setAttribute('viewBox', DEFAULT_VB.join(' ')); return; }
    // never smaller than the default frame, always enough room around the drawing
    const minX = Math.min(bounds.minX - VB_PAD, DEFAULT_VB[0]);
    const minY = Math.min(bounds.minY - VB_PAD, DEFAULT_VB[1]);
    const maxX = Math.max(bounds.maxX + VB_PAD, DEFAULT_VB[2]);
    const maxY = Math.max(bounds.maxY + VB_PAD, DEFAULT_VB[3]);
    svg.setAttribute('viewBox', `${minX} ${minY} ${maxX - minX} ${maxY - minY}`);
  }

  function stepMode(){ return document.getElementById('toggleStep').checked; }

  function nextLabel(){
    let n = letterCounter++, s = '';
    do { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n/26) - 1; } while (n >= 0);
    return s;
  }

  function resetAll(){
    topNodes = []; botNodes = [];
    edgeCount = 0; letterCounter = 0;
    placedExt = []; animQueue = []; animating = false;
    counts = {cross:0, top:0, bottom:0}; groupsExpected = null;
    svg.innerHTML = '';
    resetBounds();
    fitViewBox();
    updateFormula();
    updateStepButton();
  }

  function updateFormula(){
    const n = topNodes.length + botNodes.length;
    document.getElementById('formulaVal').textContent = edgeCount + `  (n = ${n})`;
    updateBreakdown();
  }
  function updateBreakdown(){
    const g = groupsExpected, set = (id, v) => { document.getElementById(id).textContent = v; };
    const c2 = k => k*(k-1)/2;
    if (!g) {
      ['bdTopVal','bdBottomVal','bdLinesVal','bdTotalVal'].forEach(id => set(id, '0 / 0'));
      set('bdIdentity', t('bdGeneric'));
      return;
    }
    const eTop = c2(g.a), eBot = c2(g.b), eLines = g.a*g.b, eTotal = eTop + eBot + eLines;
    set('bdTopVal', `${counts.top} / ${eTop}`);
    set('bdBottomVal', `${counts.bottom} / ${eBot}`);
    set('bdLinesVal', `${counts.cross} / ${eLines}`);
    set('bdTotalVal', `${edgeCount} / ${eTotal}`);
    set('bdIdentity', `C(${g.a+g.b}, 2) = C(${g.a}, 2) + C(${g.b}, 2) + ${g.a} × ${g.b}  →  ${eTotal} = ${eTop} + ${eBot} + ${eLines}`);
  }

  function svgEl(tag, attrs){
    const el = document.createElementNS(svgNS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function drawPoint(node){
    if (artMode) {
      const dot = svgEl('circle', {cx:node.x+X0, cy:node.y, r:3, class:'art-dot', 'data-t':artT(node.order)});
      svg.appendChild(dot); styleArt(dot);
      expand(node.x+X0-14, node.y-14); expand(node.x+X0+14, node.y+14);
      return;
    }
    svg.appendChild(svgEl('circle', {cx:node.x+X0, cy:node.y, r:6, fill:RED}));
    const txt = svgEl('text', {x:node.x+X0, y: node.row==='top' ? node.y-14 : node.y+26, class:'node-label', 'text-anchor':'middle'});
    txt.textContent = node.label;
    svg.appendChild(txt);
    expand(node.x+X0-14, node.y-40); expand(node.x+X0+14, node.y+40);
  }

  function labelWithBg(x, y, text){
    const w = 9*String(text).length + 8;
    svg.appendChild(svgEl('rect', {x:x-w/2, y:y-10, width:w, height:18, rx:3, class:'num-bg'}));
    const el = svgEl('text', {x, y:y+4, class:'num-label', 'text-anchor':'middle'});
    el.textContent = text;
    svg.appendChild(el);
    expand(x-w/2, y-10); expand(x+w/2, y+10);
  }

  function queueCurve(a, b, row){
    animQueue.push(()=>{
      edgeCount++; counts[row === 'top' ? 'top' : 'bottom']++;
      const x1 = a.x+X0, x2 = b.x+X0, y = a.y;
      const r = Math.abs(x2-x1)/2, cx = (x1+x2)/2;
      const apexY = row==='top' ? y - r : y + r;
      if (artMode) {
        const arc = svgEl('path', {d:`M ${x1} ${y} A ${r} ${r} 0 0 ${row==='top'?1:0} ${x2} ${y}`, fill:'none', class:'art-arc', 'data-t':artT(b.order)});
        svg.appendChild(arc); styleArt(arc);
        expand(x1, y); expand(x2, apexY);
        updateFormula();
        return;
      }
      svg.appendChild(svgEl('path', {
        d:`M ${x1} ${y} A ${r} ${r} 0 0 ${row==='top'?1:0} ${x2} ${y}`,
        stroke:GRAY, fill:'none', 'stroke-width':1.4, opacity:0.85
      }));
      expand(x1, y); expand(x2, apexY);
      labelWithBg(cx, row==='top' ? apexY-10 : apexY+14, edgeCount);
      updateFormula();
    });
  }

  function queueCross(newNode, target){
    animQueue.push(()=>{
      edgeCount++; counts.cross++;
      const nx = newNode.x+X0, ny = newNode.y, tx = target.x+X0, ty = target.y;
      if (artMode) {
        const ln = svgEl('line', {x1:tx,y1:ty,x2:nx,y2:ny, class:'art-cross', 'data-t':artT(newNode.order)});
        svg.appendChild(ln); styleArt(ln);
        expand(nx, ny); expand(tx, ty);
        updateFormula();
        return;
      }
      svg.appendChild(svgEl('line', {x1:tx,y1:ty,x2:nx,y2:ny, stroke:GRAY,'stroke-width':1.2, opacity:0.6}));

      // Green/teal extension = exact continuation of the gray line (same slope);
      // only its LENGTH grows until its number clears all previous numbers.
      let dx = nx - tx, dy = ny - ty;
      const len = Math.hypot(dx,dy); dx/=len; dy/=len;
      let L = L_START, ex, ey;
      while (true) {
        ex = nx + dx*L; ey = ny + dy*L;
        if (placedExt.every(p => Math.hypot(ex-p.x, ey-p.y) >= MIN_DIST) || L >= L_MAX) break;
        L += L_STEP;
      }
      placedExt.push({x:ex, y:ey});
      svg.appendChild(svgEl('line', {x1:nx,y1:ny,x2:ex,y2:ey, stroke:TEAL,'stroke-width':1.6, opacity:0.85, class:'ext-line'}));
      expand(nx, ny); expand(tx, ty); expand(ex, ey);
      labelWithBg(ex, ey, edgeCount);
      updateFormula();
    });
  }

  function addNode(){
    const row = topNodes.length <= botNodes.length ? 'top' : 'bottom';
    const arr = row==='top' ? topNodes : botNodes;
    const other = row==='top' ? botNodes : topNodes;
    const order = letterCounter;
    const node = { label: nextLabel(), order, row, x: arr.length*SPACING, y: row==='top'?TOP_Y:BOT_Y };

    drawPoint(node);                         // point appears immediately
    other.forEach(tgt => queueCross(node, tgt));   // then edges are staggered / stepped
    arr.forEach(s => queueCurve(s, node, row));
    arr.push(node);
    fitViewBox();
    updateStepButton();
  }

  // Two groups of chosen sizes a (top) and b (bottom), counted in stages:
  // straight lines first, then arcs of group A, then arcs of group B.
  function buildGroups(a, b){
    resetAll();
    groupsExpected = {a, b};
    const longest = Math.max(a, b);
    const mkRow = (count, row) => {
      const off = (longest - count) * SPACING / 2;
      const nodes = [];
      for (let k = 0; k < count; k++) {
        const order = letterCounter;
        const node = { label: nextLabel(), order, row, x: off + k*SPACING, y: row==='top' ? TOP_Y : BOT_Y };
        drawPoint(node);
        nodes.push(node);
      }
      return nodes;
    };
    topNodes = mkRow(a, 'top');
    botNodes = mkRow(b, 'bottom');
    for (let i = 0; i < a; i++)
      for (let j = 0; j < b; j++)
        ((i + j) % 2 === 0) ? queueCross(topNodes[i], botNodes[j]) : queueCross(botNodes[j], topNodes[i]);
    for (let i = 0; i < a; i++) for (let j = i + 1; j < a; j++) queueCurve(topNodes[i], topNodes[j], 'top');
    for (let i = 0; i < b; i++) for (let j = i + 1; j < b; j++) queueCurve(botNodes[i], botNodes[j], 'bottom');
    fitViewBox();
    updateFormula();
    maybeAutoPlay();
  }

  function updateStepButton(){
    const btn = document.getElementById('nextBtn');
    if (stepMode() && animQueue.length > 0) {
      btn.style.display = 'inline-block';
      btn.textContent = `${t('nextConnection')} (${animQueue.length})`;
    } else {
      btn.style.display = 'none';
    }
  }

  function runQueue(){
    if (animating) return;
    animating = true;
    // Small diagrams: relaxed pace (130 ms/connection). Large diagrams: faster,
    // so the whole build takes roughly 8 seconds at most.
    const total = Math.max(1, animQueue.length);
    const delay = Math.max(8, Math.min(130, Math.round(8000 / total)));
    const perTick = Math.max(1, Math.ceil(total * delay / 8000));
    (function loop(){
      if (stepMode() || animQueue.length === 0) { animating = false; fitViewBox(); updateStepButton(); return; }
      for (let i = 0; i < perTick && animQueue.length > 0; i++) animQueue.shift()();
      fitViewBox();
      updateStepButton();
      setTimeout(loop, delay);
    })();
  }

  function maybeAutoPlay(){ if (!stepMode()) runQueue(); else updateStepButton(); }

  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if (animQueue.length === 0) return;
    animQueue.shift()();
    fitViewBox();
    updateStepButton();
  });
  document.getElementById('toggleStep').addEventListener('change', ()=>{
    updateStepButton();
    if (!stepMode()) runQueue();
  });

  // ---------------------------------------------------------------
  // UI WIRING
  // ---------------------------------------------------------------
  document.querySelectorAll('.hs-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.hs-tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.hs-panel').forEach(p=>p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
      document.getElementById('hsApp').setAttribute('data-mode', tab.dataset.tab);
      const toArt = tab.dataset.tab === 'art';
      if (toArt !== artMode) {
        artMode = toArt;
        resetAll();
        applyArtBg();
        document.getElementById('togglesRow').style.display = artMode ? 'none' : 'flex';
      }
    });
  });

  document.getElementById('addBtn').addEventListener('click', ()=>{ addNode(); maybeAutoPlay(); });

  document.getElementById('solveBtn').addEventListener('click', ()=>{
    const mode = document.querySelector('input[name=solveMode]:checked').value;
    const val = parseInt(document.getElementById('totalInput').value, 10);
    const msg = document.getElementById('solveMsg');
    msg.textContent = '';
    if (!val || val < 1) { msg.textContent = t('errNoInput'); return; }

    let target;
    if (mode === 'people') {
      if (val < 2) { msg.textContent = t('errMinPeople'); return; }
      target = val;
    } else {
      const n = (1 + Math.sqrt(1 + 8*val)) / 2;
      if (Math.abs(n - Math.round(n)) > 1e-9) {
        const lo = Math.floor(n), hi = Math.ceil(n);
        msg.textContent = t('errInvalidTotal')(lo, lo*(lo-1)/2, hi, hi*(hi-1)/2);
        return;
      }
      target = Math.round(n);
    }
    resetAll();
    for (let i = 0; i < target; i++) addNode();
    maybeAutoPlay();
  });

  document.getElementById('resetBtn1').addEventListener('click', resetAll);
  document.getElementById('resetBtn2').addEventListener('click', resetAll);

  document.getElementById('toggleLetters').addEventListener('change', e=>{
    svg.parentElement.classList.toggle('hide-letters', !e.target.checked);
  });
  document.getElementById('toggleNumbers').addEventListener('change', e=>{
    svg.parentElement.classList.toggle('hide-numbers', !e.target.checked);
  });

  document.getElementById('groupsBuildBtn').addEventListener('click', ()=>{
    const a = parseInt(document.getElementById('groupA').value, 10);
    const b = parseInt(document.getElementById('groupB').value, 10);
    const msg = document.getElementById('groupsMsg');
    msg.textContent = '';
    if (!a || !b || a < 1 || b < 1) { msg.textContent = t('errGroups'); return; }
    buildGroups(a, b);
  });
  document.getElementById('resetBtn4').addEventListener('click', resetAll);

  // ---------------------------------------------------------------
  // ART MODE CONTROLS
  // ---------------------------------------------------------------
  document.getElementById('artBuildBtn').addEventListener('click', ()=>{
    const n = parseInt(document.getElementById('artInput').value, 10);
    const msg = document.getElementById('artMsg');
    msg.textContent = '';
    if (!n || n < 1) { msg.textContent = t('errNoInput'); return; }
    if (n < 2) { msg.textContent = t('errMinPeople'); return; }
    resetAll();
    artTotal = n;
    for (let i = 0; i < n; i++) addNode();
    while (animQueue.length) animQueue.shift()();   // art is drawn instantly
    fitViewBox(); updateFormula(); updateStepButton();
  });
  document.getElementById('resetBtn3').addEventListener('click', resetAll);
  document.getElementById('artPalette').addEventListener('change', restyleAll);
  document.getElementById('artWeight').addEventListener('input', restyleAll);
  document.getElementById('artBg').addEventListener('change', applyArtBg);
  document.getElementById('artShowLines').addEventListener('change', e=>{
    svg.parentElement.classList.toggle('hide-art-cross', !e.target.checked);
  });
  document.getElementById('artShowArcs').addEventListener('change', e=>{
    svg.parentElement.classList.toggle('hide-art-arc', !e.target.checked);
  });

  // ---------------------------------------------------------------
  // EXPORT (SVG + PNG) with signature / watermark at the bottom
  // ---------------------------------------------------------------
  function buildExportSvg(){
    const vb = svg.getAttribute('viewBox').split(' ').map(Number);   // [x, y, w, h]
    const withSig = !artMode || document.getElementById('artSignature').checked;
    const SIG = withSig ? 44 : 0;
    const bgColor = artMode ? ART_BGS[document.getElementById('artBg').value] : '#ffffff';
    const dark = artMode && document.getElementById('artBg').value === 'night';

    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', svgNS);
    clone.setAttribute('width', Math.round(vb[2]));
    clone.setAttribute('height', Math.round(vb[3] + SIG));
    clone.setAttribute('viewBox', `${vb[0]} ${vb[1]} ${vb[2]} ${vb[3] + SIG}`);

    if (bgColor) {
      const bg = document.createElementNS(svgNS, 'rect');
      bg.setAttribute('x', vb[0]); bg.setAttribute('y', vb[1]);
      bg.setAttribute('width', vb[2]); bg.setAttribute('height', vb[3] + SIG);
      bg.setAttribute('fill', bgColor);
      clone.insertBefore(bg, clone.firstChild);
    }

    const style = document.createElementNS(svgNS, 'style');
    style.textContent =
      `.node-label{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:20px;fill:${RED};}` +
      `.num-label{font-family:'Courier New',monospace;font-size:13px;fill:${TEAL};}` +
      `.num-bg{fill:#fff;opacity:0.88;}`;
    clone.insertBefore(style, clone.firstChild);

    if (!document.getElementById('toggleLetters').checked)
      clone.querySelectorAll('.node-label').forEach(e=>e.remove());
    if (!document.getElementById('toggleNumbers').checked)
      clone.querySelectorAll('.num-label,.num-bg,.ext-line').forEach(e=>e.remove());
    if (artMode) {
      if (!document.getElementById('artShowLines').checked) clone.querySelectorAll('.art-cross').forEach(e=>e.remove());
      if (!document.getElementById('artShowArcs').checked) clone.querySelectorAll('.art-arc').forEach(e=>e.remove());
    }

    if (withSig) {
      const wm = document.createElementNS(svgNS, 'text');
      wm.setAttribute('x', vb[0] + vb[2]/2); wm.setAttribute('y', vb[1] + vb[3] + 28);
      wm.setAttribute('text-anchor', 'middle');
      wm.setAttribute('font-family', 'Georgia, serif');
      wm.setAttribute('font-style', 'italic');
      wm.setAttribute('font-size', '14');
      wm.setAttribute('fill', dark ? '#aab0c0' : '#8a8f8a');
      wm.textContent = t('watermark');
      clone.appendChild(wm);
    }
    return { text: new XMLSerializer().serializeToString(clone), w: Math.round(vb[2]), h: Math.round(vb[3] + SIG) };
  }

  function downloadBlob(blob, name){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const out = buildExportSvg();
    downloadBlob(new Blob([out.text], {type:'image/svg+xml;charset=utf-8'}), artMode ? 'bipartite-arc-art.svg' : 'handshake-diagram.svg');
  });

  document.getElementById('exportPngBtn').addEventListener('click', ()=>{
    const out = buildExportSvg();
    const scale = Math.min(3, 4000 / Math.max(out.w, out.h));   // PNG is a quick-share copy; SVG stays the sharp master
    const img = new Image();
    const url = URL.createObjectURL(new Blob([out.text], {type:'image/svg+xml;charset=utf-8'}));
    img.onload = ()=>{
      const c = document.createElement('canvas');
      c.width = Math.round(out.w * scale); c.height = Math.round(out.h * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { downloadBlob(b, artMode ? 'bipartite-arc-art.png' : 'handshake-diagram.png'); URL.revokeObjectURL(url); }, 'image/png');
    };
    img.src = url;
  });

  resetAll();
  applyLanguage('en');
})();
</script>
</body>
</html>
